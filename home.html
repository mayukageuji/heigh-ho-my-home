<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>heigh-ho-my-home.com</title><link rel="stylesheet" href="style.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8b79eb}.page{position:relative;width:100vw;height:100vh;background:#8b79eb;overflow:hidden}.instructions{position:absolute;left:18px;bottom:14px;font:12px/1.3 "Gill Sans","Gill Sans MT",sans-serif;opacity:.65}.letter{position:absolute;left:50%;top:50%;font-family:"Gill Sans","Gill Sans MT","Trebuchet MS",sans-serif;font-size:clamp(42px,8vw,120px);font-style:italic;text-decoration:underline;text-underline-offset:7px;cursor:grab;user-select:none;touch-action:none;transform:translate(-50%,-50%);transition:left 1.1s cubic-bezier(.18,.75,.2,1),top 1.1s cubic-bezier(.18,.75,.2,1),transform 1.1s cubic-bezier(.18,.75,.2,1)}.letter.frozen{transition:none;cursor:grab}.letter.dragging{cursor:grabbing}.hidden-title{display:none}
</style></head>
<body><main class="page" id="page"><div class="hidden-title" id="source">heigh-ho-my-home.com</div><div class="instructions" id="instructions">touch / click / move</div></main>
<script>
const page=document.getElementById('page'), source=document.getElementById('source'), instructions=document.getElementById('instructions');
const text=source.textContent.trim(); let letters=[], state='still', startX=0,startY=0;
text.split('').forEach((ch,i)=>{const el=document.createElement('span');el.className='letter';el.textContent=ch===' '?'\u00a0':ch; page.appendChild(el);letters.push(el);});
function scatter(){ if(state!=='still') return; state='flying'; instructions.textContent='tap / move again → stop'; letters.forEach((el,i)=>{const x=8+Math.random()*84,y=8+Math.random()*84,r=-35+Math.random()*70,s=.65+Math.random()*.8;el.style.left=x+'vw';el.style.top=y+'vh';el.style.transform=`translate(-50%,-50%) rotate(${r}deg) scale(${s})`;}); }
function freeze(){ if(state!=='flying') return; state='frozen'; instructions.textContent='drag the letters'; letters.forEach(el=>el.classList.add('frozen')); }
page.addEventListener('pointerdown',e=>{if(state==='still'){scatter();return} if(state==='flying'){freeze();return}});
page.addEventListener('wheel',e=>{if(state==='still') scatter(); else if(state==='flying') freeze();});
let down=false;
letters.forEach(el=>{el.addEventListener('pointerdown',e=>{if(state!=='frozen')return; e.stopPropagation(); down=true; el.setPointerCapture(e.pointerId); el.classList.add('dragging');});el.addEventListener('pointermove',e=>{if(!down)return; const rect=page.getBoundingClientRect();el.style.left=((e.clientX-rect.left)/rect.width*100)+'vw';el.style.top=((e.clientY-rect.top)/rect.height*100)+'vh';});el.addEventListener('pointerup',e=>{down=false;el.classList.remove('dragging');});});
</script></body></html>
