  body {
    margin: 0;
    background: #FFFF99;
    color: #000;
    cursor: pointer;
  }

  .support-page {
    min-height: 100vh;
    box-sizing: border-box;
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px;

    overflow: hidden;

  }


  /* =========================
     星空
  ========================= */

.star {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #fff;
  border-radius: 50%;
}

.star.small {
  width: 2px;
  height: 2px;
}

.star.large {
  width: 6px;
  height: 6px;
}


  /* =========================
     メッセージ
  ========================= */

  .support-message {
    position: relative;
    z-index: 2;

    max-width: 80vw;

    font-family:
      "Gill Sans",
      "Yu Gothic",
      YuGothic,
      sans-serif;

    font-size: clamp(24px, 4vw, 56px);
    line-height: 1.35;
    font-weight: normal;

    text-align: center;

    white-space: pre-line;

    transition: opacity 0.25s ease;
  }


  /* =========================
     引用者
  ========================= */

  .support-author {
    position: absolute;

    z-index: 2;

    bottom: 30px;
    left: 30px;

    font-family:
      "Gill Sans",
      "Yu Gothic",
      YuGothic,
      sans-serif;

    font-size: 9px;
  }


  /* =========================
     home
  ========================= */

  .back {
    position: absolute;

    z-index: 3;

    bottom: 30px;
    right: 30px;

    color: #000;

    font-family:
      "Gill Sans",
      "Yu Gothic",
      YuGothic,
      sans-serif;

    font-size: 10px;

    text-decoration: none;
  }

  .back:hover {
    text-decoration: underline;
  }

</style>
</head>

/* =========================

========================= */

const message = document.getElementById("message");
const author = document.getElementById("author");

let messagePool = [];


/*
  メッセージをシャッフル
*/

function shuffleMessages() {

  messagePool = [...messages];

  for (let i = messagePool.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [messagePool[i], messagePool[j]] =
      [messagePool[j], messagePool[i]];

  }

}


/*
  次のメッセージ
*/

function showNextMessage() {

  if (messagePool.length === 0) {
    shuffleMessages();
  }

  const item = messagePool.pop();

  message.style.opacity = 0;

  setTimeout(function() {

    message.innerText = item.text;
    author.innerText = item.author;

    message.style.opacity = 1;

  }, 180);

}

*/

  .addEventListener("click", function() {
