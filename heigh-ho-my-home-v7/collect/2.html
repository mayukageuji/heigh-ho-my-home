<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>2</title>

<link rel="stylesheet" href="../style.css">

<style>
.collection-page{
  padding:28px 5vw 12vw;
  background:#fff;
  min-height:100vh;
}

.back{
  display:inline-block;
  color:#000;
  font-size:12px;
  text-decoration:underline;
  margin-bottom:34px;
}

.collection-title{
  font-size:clamp(28px,4vw,58px);
  font-style:italic;
  text-decoration:underline;
  text-underline-offset:5px;
  margin-bottom:28px;
}

.collection-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  align-items:start;
}

.collection-grid figure{
  margin:0;
}

.collection-grid img{
  display:block;
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
}

@media(max-width:700px){
  .collection-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:6px;
  }
}
</style>
</head>

<body>

<main class="collection-page">

  <a class="back" href="index.html">← things I found</a>

  <div class="collection-title">2</div>

  <div class="collection-grid">

    <figure><img src="images/2-01.jpeg" alt=""></figure>
    <figure><img src="images/2-02.jpeg" alt=""></figure>
    <figure><img src="images/2-03.jpeg" alt=""></figure>
    <figure><img src="images/2-04.jpeg" alt=""></figure>
    <figure><img src="images/2-05.jpeg" alt=""></figure>
    <figure><img src="images/2-06.jpeg" alt=""></figure>
    <figure><img src="images/2-07.jpeg" alt=""></figure>
    <figure><img src="images/2-08.jpeg" alt=""></figure>
    <figure><img src="images/2-09.jpeg" alt=""></figure>
    <figure><img src="images/2-10.jpeg" alt=""></figure>
    <figure><img src="images/2-11.jpeg" alt=""></figure>
    <figure><img src="images/2-12.jpeg" alt=""></figure>
    <figure><img src="images/2-13.jpeg" alt=""></figure>
    <figure><img src="images/2-14.jpeg" alt=""></figure>
    <figure><img src="images/2-15.jpeg" alt=""></figure>
    <figure><img src="images/2-16.jpeg" alt=""></figure>
    <figure><img src="images/2-17.jpeg" alt=""></figure>
    <figure><img src="images/2-18.jpeg" alt=""></figure>
    <figure><img src="images/2-19.jpeg" alt=""></figure>
    <figure><img src="images/2-20.jpeg" alt=""></figure>

  </div>

</main>

<script>

document.querySelectorAll(".collection-grid img").forEach(function(img){

  img.addEventListener("error", function(){
    img.parentElement.remove();
  });

});

</script>

</body>
</html>
