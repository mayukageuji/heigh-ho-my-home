<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>実験</title>

<link rel="stylesheet" href="../style.css">

<style>
  body {
    margin: 0;
    background: #e52f35;
  }

  .experiment-page {
    min-height: 100vh;
    box-sizing: border-box;
    background: #e52f35;
    padding: 30px;
    color: #000;
  }

  .experiment-title-image {
    display: block;
    width: min(360px, 55vw);
    height: auto;
    max-height: 110px;
    object-fit: contain;
    object-position: left top;
    margin: 0 0 26px 0;
  }

  .experiment-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .experiment-card {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 14px;

    min-height: 42vh;
    padding: 10px;
    box-sizing: border-box;

    background: #fff;
    color: #000;
    text-decoration: none;
  }

  .experiment-card:hover {
    outline: 1px solid #1554ff;
    outline-offset: -1px;
  }

  .experiment-meta {
    font-family: Arial, sans-serif;
    font-size: 8px;
    line-height: 1.3;
    padding: 3px;
  }

  /* =========================
     Kyori01 images
     ========================= */

  .experiment-images {
    display: flex;
    align-items: flex-start;
    min-width: 0;
  }

  .experiment-images .experiment-image {
    display: block;

    width: calc((100% - 54px) / 4);
    height: auto;

    aspect-ratio: 3 / 4;
    object-fit: cover;

    background: #ddd;

    margin-right: 18px;
  }

  .experiment-images .experiment-image:last-child {
    margin-right: 0;
  }


  /* placeholder */

  .experiment-placeholder {
    width: calc((100% - 36px) / 3);
    aspect-ratio: 3 / 4;
    background: #ddd;
    margin-right: 18px;
  }

  .experiment-placeholder:last-child {
    margin-right: 0;
  }


  .back {
    display: inline-block;
    color: #fff;
    margin-top: 22px;
    font-size: 12px;
  }


  @media (max-width: 700px) {

    .experiment-page {
      padding: 16px;
    }

    .experiment-title-image {
      width: 65vw;
      margin-bottom: 20px;
    }

    .experiment-card {
      grid-template-columns: 55px 1fr;
      min-height: 58vh;
      gap: 8px;
      padding: 8px;
    }

    .experiment-images .experiment-image {
      width: calc((100% - 24px) / 4);
      margin-right: 8px;
    }

    .experiment-placeholder {
      width: calc((100% - 16px) / 3);
      margin-right: 8px;
    }

  }
</style>
</head>


<body>

<main class="experiment-page">

  <img
    class="experiment-title-image"
    src="images/experiment-title.svg"
    alt="実験"
  >


  <div class="experiment-list">

</html>
