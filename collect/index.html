<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>collect</title>
<link rel="stylesheet" href="../style.css">

<style>
.collect-page{
  min-height:100vh;
  padding:70px 7vw 10vw;
  background:#fff;
}

.collect-title-image{
  display:block;
  width:min(520px,80vw);
  height:auto;
  margin-bottom:50px;
}

.collect-rooms{
  width:min(520px,100%);
  display:flex;
  flex-direction:column;
  gap:18px;
}

.collect-room{
  border:1px solid #111;
  padding:5px 8px;
  height:42px;
  display:flex;
  align-items:center;
  color:#000;
  text-decoration:none;
  font-size:14px;
}

.collect-room:hover{
  background:#000;
  color:#fff;
}

.collect-note{
  font-size:11px;
  margin-top:30px;
  line-height:1.5;
}
</style>
</head>

<body>

<main class="collect-page">

  <img
    class="collect-title-image"
    src="images/collect-title.svg"
    alt="things I found"
  >

  <nav class="collect-rooms">
    <a class="collect-room" href="1.html">1 →</a>
    <a class="collect-room" href="2.html">2 →</a>
    <a class="collect-room" href="3.html">3 →</a>
  </nav>

  <p class="collect-note">
    A collection that keeps growing.<br>
    Each room can hold a different number of things.
  </p>

</main>

</body>
</html>
